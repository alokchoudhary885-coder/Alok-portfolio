<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D tech sphere & geometric cyber-crystal constellation for Alok Choudhary's portfolio hero (Monochrome Minimalist Black & White)
const width = container.clientWidth || window.innerWidth || 600;
const height = container.clientHeight || window.innerHeight || 600;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.z = 5.2;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting — Monochrome Pure White and Crisp Highlights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xffffff, 3.5, 30);
pointLight1.position.set(4, 5, 4);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x888888, 2.5, 30);
pointLight2.position.set(-4, -4, -2);
scene.add(pointLight2);

// Central tech geometric wireframe / glossy multi-faceted core
const group = new THREE.Group();
scene.add(group);

// 1. Icosahedron core with monochrome dark charcoal & specular white
const innerGeo = new THREE.IcosahedronGeometry(1.6, 2);
const innerMat = new THREE.MeshPhongMaterial({
  color: 0x111111,
  emissive: 0x1a1a1a,
  specular: 0xffffff,
  shininess: 95,
  wireframe: false,
  flatShading: true,
  transparent: true,
  opacity: 0.88
});
const coreMesh = new THREE.Mesh(innerGeo, innerMat);
group.add(coreMesh);

// 2. Wireframe outer shell glowing crisp white
const wireGeo = new THREE.IcosahedronGeometry(1.85, 2);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  wireframe: true,
  transparent: true,
  opacity: 0.35
});
const wireMesh = new THREE.Mesh(wireGeo, wireMat);
group.add(wireMesh);

// 3. Floating orbit rings — Monochrome Pure White
const ringMat1 = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.45
});

const ringGeo1 = new THREE.TorusGeometry(2.4, 0.018, 16, 100);
const ringMesh1 = new THREE.Mesh(ringGeo1, ringMat1);
ringMesh1.rotation.x = Math.PI / 3;
group.add(ringMesh1);

const ringGeo2 = new THREE.TorusGeometry(2.7, 0.014, 16, 100);
const ringMat2 = new THREE.MeshBasicMaterial({
  color: 0xcccccc,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.3
});
const ringMesh2 = new THREE.Mesh(ringGeo2, ringMat2);
ringMesh2.rotation.y = Math.PI / 4;
ringMesh2.rotation.x = -Math.PI / 5;
group.add(ringMesh2);

// 4. Floating tech particles / nodes — Pure White Points
const particleCount = 120;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
  const r = 2.0 + Math.random() * 2.2;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  positions[i] = r * Math.sin(phi) * Math.cos(theta);
  positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i + 2] = r * Math.cos(phi);
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.05,
  transparent: true,
  opacity: 0.8
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
group.add(particleSystem);

// Mouse interaction tracking
let targetRotX = 0;
let targetRotY = 0;
let mouseX = 0;
let mouseY = 0;

window.addEventListener('mousemove', (e) => {
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left - (rect.width / 2);
  const y = e.clientY - rect.top - (rect.height / 2);
  mouseX = (x / rect.width) * 2;
  mouseY = -(y / rect.height) * 2;
});

// Resize handler
const onResize = () => {
  if (!container) return;
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', onResize);

// Animation loop
let clock = new THREE.Clock();
const animate = () => {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  targetRotY += (mouseX * 0.8 - targetRotY) * 0.05;
  targetRotX += (mouseY * 0.8 - targetRotX) * 0.05;

  coreMesh.rotation.y = elapsedTime * 0.25 + targetRotY;
  coreMesh.rotation.x = elapsedTime * 0.15 + targetRotX;

  wireMesh.rotation.y = -elapsedTime * 0.2 + targetRotY * 1.2;
  wireMesh.rotation.z = elapsedTime * 0.1;

  ringMesh1.rotation.z = elapsedTime * 0.35;
  ringMesh2.rotation.z = -elapsedTime * 0.25;

  particleSystem.rotation.y = elapsedTime * 0.08;

  renderer.render(scene, camera);
};
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
